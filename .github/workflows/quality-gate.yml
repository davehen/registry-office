name: Quality gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Build and test (Java 17)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify backend and frontend reactor
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Upload independent artifacts
        uses: actions/upload-artifact@v4
        with:
          name: registry-office-artifacts
          path: |
            backend/target/registry-office-backend-*.jar
            frontend/dist/
          if-no-files-found: error
  browser:
    name: Browser acceptance (separate origins)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser OS dependencies
        working-directory: frontend
        run: |
          npm install --global npm@11.19.1 --ignore-scripts
          npm ci --ignore-scripts
          npm exec -- playwright install --with-deps chromium
      - name: Run browser E2E profile
        run: ./mvnw --batch-mode --no-transfer-progress clean verify -Pe2e
      - name: Preserve browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            frontend/target/playwright-results/
            frontend/target/playwright-report/
            frontend/target/playwright-results.json
          if-no-files-found: ignore
