name: Quality gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test (Java 17)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Maven quality gate
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Set up Node for UI tests
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up pnpm
        run: npm install --global pnpm@11.25.0 --ignore-scripts

      - name: Install UI test dependencies
        working-directory: dev_scripts/ui_tests
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Chromium for UI tests
        working-directory: dev_scripts/ui_tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Run UI quality gate
        working-directory: dev_scripts/ui_tests
        run: pnpm test

      - name: Run real backend browser acceptance
        working-directory: dev_scripts/ui_tests
        env:
          REGISTRY_BASE_URL: http://127.0.0.1:8080
        run: |
          java -jar ../../target/registry-office-1.0.0.jar > "$RUNNER_TEMP/registry-office-app.log" 2>&1 &
          registry_app_pid=$!
          trap 'kill "$registry_app_pid"' EXIT
          registry_ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent "$REGISTRY_BASE_URL/person" > /dev/null; then
              registry_ready=true
              break
            fi
            sleep 1
          done
          test "$registry_ready" = true
          pnpm exec playwright test --config playwright.real.config.cjs
