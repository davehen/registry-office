name: Quality gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test (Java 17)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Maven quality gate
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Set up Node for UI tests
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up pnpm
        run: npm install --global pnpm@11.25.0 --ignore-scripts

      - name: Install UI test dependencies
        working-directory: dev_scripts/ui_tests
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Chromium for UI tests
        working-directory: dev_scripts/ui_tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Run UI quality gate
        working-directory: dev_scripts/ui_tests
        run: pnpm test
